databases:
  - name: career-copilot-db
    plan: free
    databaseName: career_copilot
    user: career_copilot_user
    postgresMajorVersion: "16"

  - name: career-copilot-redis
    plan: free

services:
  # ── Express.js API ─────────────────────────────────────────────────────────
  - type: web
    name: career-copilot-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build --workspace=packages/db && npm run build --workspace=api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: career-copilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: career-copilot-redis
          type: redis
          property: connectionString
      - key: AI_SERVICE_URL
        value: http://career-copilot-ai:10000
      - key: APP_URL
        sync: false # set manually after Vercel deploy
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  # ── Python AI Service ──────────────────────────────────────────────────────
  - type: web
    name: career-copilot-ai
    runtime: python
    plan: free
    rootDir: apps/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: JSEARCH_API_KEY
        sync: false
